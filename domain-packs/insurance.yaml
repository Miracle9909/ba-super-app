name: Insurance Pack
version: "1.0"
domain: insurance
expert_persona: "Chuyên gia nghiệp vụ bảo hiểm nhân thọ, am hiểu về sản phẩm bảo hiểm, quy trình thẩm định rủi ro, bồi thường, và luật kinh doanh bảo hiểm. Nhiệm vụ của bạn là hướng dẫn khám phá yêu cầu nghiệp vụ một cách có hệ thống, không tự bịa đặt thông tin."
entities:
  - name: Bên mua BH
    type: core
    description: Cá nhân hoặc tổ chức tham gia đóng phí bảo hiểm.
  - name: Người được BH
    type: core
    description: Người mà tính mạng hoặc sức khỏe được bảo vệ bởi hợp đồng bảo hiểm.
  - name: Hợp đồng
    type: process
    description: Hợp đồng bảo hiểm nhân thọ.
  - name: Quyền lợi
    type: core
    description: Số tiền hoặc lợi ích mà người được bảo hiểm nhận được khi xảy ra sự kiện bảo hiểm.
  - name: Phí BH
    type: core
    description: Số tiền bên mua bảo hiểm phải đóng.
  - name: Yêu cầu bồi thường (Claim)
    type: process
    description: Yêu cầu chi trả quyền lợi bảo hiểm khi có sự kiện xảy ra.
rules:
  - id: BR-01
    name: Thẩm định sức khoẻ
    description: Quyết định chấp nhận bảo hiểm phụ thuộc vào độ tuổi và Số tiền bảo hiểm (STBH).
  - id: BR-02
    name: Thời gian chờ
    description: Phải qua một thời gian chờ (waiting period) nhất định trước khi một số quyền lợi có hiệu lực.
  - id: BR-03
    name: Loại trừ bồi thường
    description: Các trường hợp rủi ro có sẵn hoặc do cố ý sẽ bị loại trừ, không được bồi thường.
compliance:
  - name: Luật KDBH
    description: Tuân thủ Luật Kinh doanh Bảo hiểm.
  - name: IFRS 17
    description: Tiêu chuẩn báo cáo tài chính quốc tế về ghi nhận hợp đồng bảo hiểm.
  - name: Bảo vệ dữ liệu cá nhân
    description: Đảm bảo quyền riêng tư và bảo mật thông tin y tế, cá nhân.
terms:
  - term: STBH
    definition: Số tiền bảo hiểm
  - term: Phí BH
    definition: Phí bảo hiểm định kỳ hoặc một lần
  - term: Quyền lợi
    definition: Quyền lợi bảo hiểm
  - term: Loại trừ
    definition: Điều khoản loại trừ trách nhiệm bảo hiểm
  - term: Thời gian chờ
    definition: Khoảng thời gian từ khi hợp đồng có hiệu lực đến khi quyền lợi bảo hiểm thực sự bắt đầu
