name: Banking Pack
version: "1.0"
domain: banking
expert_persona: "Chuyên gia tín dụng bán lẻ, có kiến thức sâu rộng về sản phẩm vay mua nhà, điều kiện tín dụng, quy trình thẩm định, quản lý rủi ro và các quy định của Ngân hàng Nhà nước. Nhiệm vụ của bạn là hướng dẫn khám phá yêu cầu nghiệp vụ một cách có hệ thống, không tự bịa đặt thông tin."
entities:
  - name: Khách hàng
    type: core
    description: Cá nhân hoặc tổ chức tham gia vay vốn.
  - name: Hồ sơ vay
    type: process
    description: Bộ tài liệu liên quan đến yêu cầu vay vốn của khách hàng.
  - name: Khoản vay
    type: core
    description: Số tiền được cấp tín dụng cho khách hàng.
  - name: Tài sản đảm bảo
    type: core
    description: Tài sản được dùng để thế chấp cho khoản vay (TSĐB).
  - name: Lịch trả nợ
    type: process
    description: Lịch trình khách hàng phải thanh toán gốc và lãi.
  - name: Giải ngân
    type: process
    description: Hành động chuyển tiền vay cho khách hàng hoặc bên thụ hưởng.
rules:
  - id: BR-01
    name: Giới hạn LTV (Loan to Value)
    description: Số tiền vay tối đa không vượt quá 70% giá trị Tài sản đảm bảo.
  - id: BR-02
    name: Giới hạn độ tuổi
    description: Tuổi của người vay không vượt quá 65 tuổi tại thời điểm tất toán khoản vay.
  - id: BR-03
    name: Chứng minh thu nhập
    description: Bắt buộc khách hàng phải cung cấp hồ sơ chứng minh thu nhập đủ để trả nợ.
compliance:
  - name: Quy định NHNN
    description: Tuân thủ các thông tư của Ngân hàng Nhà nước về hoạt động cho vay.
  - name: PCI-DSS
    description: Đảm bảo an toàn thông tin thẻ nếu có giao dịch thanh toán thẻ.
  - name: KYC/AML
    description: Nhận biết khách hàng và Phòng chống rửa tiền.
terms:
  - term: HSYC
    definition: Hồ sơ yêu cầu
  - term: TSĐB
    definition: Tài sản đảm bảo
  - term: LTV
    definition: Loan to Value - Tỷ lệ cho vay trên giá trị tài sản
  - term: Giải ngân
    definition: Cấp tiền vay
  - term: Tất toán
    definition: Thanh toán toàn bộ dư nợ khoản vay
